[project]
name = "imapgw"
version = "0.1.0"
description = "IMAP4rev1 gateway over the AgentMail API (work trial)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
imapgw = "imapgw.__main__:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imapgw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
